name: nsd-agency-provider-sandbox
services:
  agency-sandbox-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: nsd_agency_test_provider
      POSTGRES_PASSWORD: synthetic-bootstrap-only
    networks: [database]
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/agency-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d nsd_agency_test_provider"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
  api:
    build:
      context: ../..
      dockerfile: ops/agency-provider-sandbox/Dockerfile
    env_file: ./sandbox.env
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://agency_test:synthetic-test-only@agency-sandbox-db:5432/nsd_agency_test_provider
      PADDLE_ENVIRONMENT: sandbox
      PADDLE_API_BASE_URL: https://sandbox-api.paddle.com
      AGENCY_STARTER_SANDBOX_PRICE_ID: pri_01kzwq9m1s1m7ss5ds5exax1cb
      AGENCY_DELIVERY_TEST_RECIPIENT: neuralshielddigital@gmail.com
      AGENCY_MEMBER_BASE_URL: http://localhost:8097/member/
      AUTOMATION_BACKGROUND_WORKER_ENABLED: "false"
      PYTHONPATH: /work/backend
    command: ["python", "-m", "uvicorn", "sandbox_app:create_app", "--factory", "--app-dir", "/work/ops/agency-provider-sandbox", "--host", "0.0.0.0", "--port", "8097", "--workers", "1", "--no-access-log", "--no-proxy-headers"]
    ports: ["127.0.0.1:8097:8097"]
    networks: [database, provider]
    depends_on:
      agency-sandbox-db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
networks:
  database:
    internal: true
  provider: {}
