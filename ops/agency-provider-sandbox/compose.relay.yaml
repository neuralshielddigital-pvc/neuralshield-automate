# Optional LOCAL preparation only; this file does not start a public tunnel.
services:
  api:
    networks: [relay_backend]
  webhook-relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    command: ["python", "-m", "uvicorn", "webhook_relay:create_app", "--factory", "--host", "0.0.0.0", "--port", "8098", "--workers", "1", "--no-access-log", "--no-proxy-headers", "--limit-concurrency", "16", "--timeout-keep-alive", "2"]
    ports: ["127.0.0.1:8098:8098"]
    # Docker Desktop needs a non-internal bridge for host port publishing.
    # The published listener remains explicitly bound to Windows loopback.
    networks: [relay_backend, relay_host]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    restart: "no"
networks:
  relay_backend:
    internal: true
  relay_host:
    driver: bridge
